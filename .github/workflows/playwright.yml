name: Playwright Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Serve fixed TechShop app
        run: python3 -m http.server 3000 --directory techshop/fixed-app > /tmp/techshop-server.log 2>&1 &

      - name: Wait for fixed TechShop app
        run: |
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "TechShop did not become available on port 3000."
          exit 1

      - name: Run Playwright tests
        run: npx playwright test
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload HTML report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-and-traces
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
